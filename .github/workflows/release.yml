name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./... && go vet ./...
      - name: Build standalone binaries and Windows bundle
        shell: bash
        run: |
          mkdir -p dist
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="setup-gateway-${os}-${arch}"
            [ "$os" != darwin ] || name="setup-gateway-macos-${arch}"
            [ "$os" != windows ] || name="${name}.exe"
            [ "$target" != windows/amd64 ] || name="setup-gateway.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "dist/$name" .
          done
          cp README.md HUONG-DAN.md Run-Setup.cmd install.ps1 install.cmd install.sh dist/
          cd dist
          zip setup-gateway-windows-amd64.zip setup-gateway.exe Run-Setup.cmd README.md HUONG-DAN.md
          sha256sum setup-gateway* > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: setup-gateway-builds
          path: dist/
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: setup-gateway-builds
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/setup-gateway*
            dist/checksums.txt
            dist/install.*
